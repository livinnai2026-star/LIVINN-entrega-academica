      .white-copy { font: 400 15px Arial, sans-serif; fill: #fff4e8; }
      .metric { font: 700 25px Arial, sans-serif; fill: #fff8ee; }
      .metric-label { font: 400 14px Arial, sans-serif; fill: #cfc7bc; }
      .number { font: 700 16px Arial, sans-serif; fill: #fff; }
      .flow { fill: none; stroke: #f2dcc0; stroke-width: 3; marker-end: url(#arrow); opacity: .82; }
      .thin { fill: none; stroke: #4d554c; stroke-width: 2; }
