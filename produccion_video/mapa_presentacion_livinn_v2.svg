<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">LIVINN, del paisaje a una operación conectada</title>
  <desc id="desc">Mapa de presentación que resume la experiencia digital desarrollada por Iván y la automatización operativa desarrollada por Miguel.</desc>
  <defs>
