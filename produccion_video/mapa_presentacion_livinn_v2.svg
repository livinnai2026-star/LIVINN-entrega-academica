      <stop offset="1" stop-color="#283027"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98245"/>
      <stop offset="1" stop-color="#b95c28"/>
