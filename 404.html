<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | LIVINN</title>
  <meta name="description" content="La página solicitada no está disponible. Regresa al sitio principal de LIVINN.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f5ead8">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png?v=20260817-round">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png?v=20260817-round">
  <link rel="stylesheet" href="/_ds/organic-5f98556b-10a2-4fb3-8f01-6522f7700a8b/styles.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}
    a{color:inherit;text-decoration:none}
    :where(a):focus-visible{outline:3px solid var(--color-accent);outline-offset:4px}
    .error-header{border-bottom:1px solid var(--color-divider);background:color-mix(in srgb,var(--color-bg) 94%,transparent)}
    .error-header-inner{max-width:1080px;margin:auto;padding:14px clamp(18px,5vw,56px)}
    .error-brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-heading);font-size:24px;letter-spacing:.06em}
    .error-brand-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--color-text) 0 62%,var(--color-accent) 62% 100%);-webkit-mask:url('/img/brand/livinn-icon.png') center/contain no-repeat;mask:url('/img/brand/livinn-icon.png') center/contain no-repeat}
    main{display:grid;place-items:center;padding:clamp(40px,8vw,96px) 20px}
    .error-card{width:min(100%,720px);padding:clamp(30px,7vw,64px);text-align:center;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:calc(var(--radius-lg) * 1.15);box-shadow:var(--shadow-md)}
    .error-code{margin:0;color:var(--color-accent);font-family:var(--font-heading);font-size:clamp(72px,18vw,150px);line-height:.8}
    h1{margin:28px 0 12px;font-family:var(--font-heading);font-size:clamp(30px,6vw,48px);line-height:1.08}
    p{max-width:52ch;margin:0 auto;color:color-mix(in srgb,var(--color-text) 72%,transparent);font-size:16px;line-height:1.65}
    .error-actions{margin-top:30px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    .error-button{min-height:48px;padding:13px 22px;border:1px solid var(--color-divider);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
    .error-button-primary{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
    .error-button-primary:hover{background:var(--color-accent-700);color:#fff}
    .error-button-secondary:hover{border-color:var(--color-accent);color:var(--color-accent-700)}
    footer{padding:18px;text-align:center;color:var(--color-neutral-500);font-size:11px}
    @media(max-width:480px){.error-actions{flex-direction:column}.error-button{width:100%}}
  </style>
</head>
<body>
  <header class="error-header">
    <div class="error-header-inner"><a class="error-brand" href="/" aria-label="Volver al inicio de LIVINN"><span class="error-brand-mark" aria-hidden="true"></span><span>LIVINN</span></a></div>
  </header>
  <main>
    <section class="error-card" aria-labelledby="error-title">
      <p class="error-code" aria-hidden="true">404</p>
      <h1 id="error-title">Esta ruta no lleva a una cabaña</h1>
      <p>La página que buscas cambió de lugar o ya no está disponible. Puedes regresar al inicio o pedir ayuda por WhatsApp.</p>
      <div class="error-actions">
        <a class="error-button error-button-primary" href="/">Volver al inicio</a>
        <a class="error-button error-button-secondary" href="https://wa.me/5216672364294?text=Hola%20LIVINN%2C%20necesito%20ayuda%20con%20el%20sitio." target="_blank" rel="noopener">Hablar con soporte</a>
      </div>
    </section>
  </main>
  <footer>© 2026 LIVINN · Sitio demostrativo — proyecto académico.</footer>
</body>
</html>
